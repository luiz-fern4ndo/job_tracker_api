[project]
name = "job-tracker-api"
version = "0.1.0"
description = "API for tracking job applications and interviews in the tech sector."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.163.1",
    "sqlalchemy>=2.1.8",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "taskipy>=1.14.1",
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
# PT: Pytest | FAST: Annotated

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev main.py'
pre_test = 'task lint'
test = 'PYTHONWARNINGS="ignore" pytest -s -x --cov=. -vv'
post_test = 'coverage html'
